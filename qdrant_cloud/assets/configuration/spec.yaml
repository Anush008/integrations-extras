name: Qdrant Cloud
files:
- name: qdrant_cloud.yaml
  options:
  - template: init_config
    options:
    - template: init_config/openmetrics
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.required: true
        openmetrics_endpoint.hidden: false
        openmetrics_endpoint.display_priority: 2
        openmetrics_endpoint.value.example: https://xyz-example.eu-central.aws.cloud.qdrant.io:6333/sys_metrics
        openmetrics_endpoint.description: |
          Endpoint exposing the Qdrant cloud's Prometheus metrics. For more information refer to:
          https://qdrant.tech/documentation/cloud/cluster-monitoring/